<!doctype html>
<html><head><meta charset="utf-8"><title>Mock ServiceTitan</title>
<style>
  body{font:13px sans-serif;margin:0}
  .appointment{display:inline-block;margin:4px;padding:6px 10px;background:#cfe;border:1px solid #9c9;cursor:pointer;color:#000;text-decoration:none}
  .modal{display:none}
  .modal.in{display:block;position:fixed;top:30%;left:30%;background:#fff;border:2px solid #333;padding:20px}
</style>
<script src="newboard.js"></script>
<script>
  // Tiny stand-in for Knockout: observables, ko.dataFor and ko.unwrap only (the Edit Job page uses it).
  (function () {
    if (location.search.indexOf('noko') > -1) return;
    const obs = v => { const f = function (x) { if (arguments.length) { v = x; return f; } return v; }; f.__obs = true; return f; };
    window.ko = {
      observable: obs,
      isObservable: f => !!(f && f.__obs),
      unwrap: v => (v && v.__obs) ? v() : v,
      dataFor: e => { while (e) { if (e.__vm) return e.__vm; e = e.parentElement; } return undefined; }
    };
  })();
  const BUS = [
    [108733206,'Commercial'],[112072629,'Electrical - Install'],[169933113,'Electrical - Maintenance'],[409186966,'Greenville Branch'],
    [591422337,'Gulfport Branch'],[473877668,'HCR'],[26125,'HVAC - Install'],[22018,'HVAC - Service'],[621842244,'Mendenhall Branch'],
    [104236911,'Plumbing - Install'],[29953,'Project Coordinator'],[593928045,'Tupelo Branch'],[999,'Old Branch']
  ];
  window.App = { Data: { BusinessUnits: BUS.map(b => ({ Id: b[0], Name: b[1], Active: b[1] !== 'Old Branch' })) } };
  const nameOf = id => (BUS.find(b => b[0] === id) || [0, '?'])[1];
  const idOf = n => (BUS.find(b => b[1] === n) || [0])[0];
  // Fake job database: job -> { bu, mode }
  window.DB = {
    111111: { bu: idOf('Gulfport Branch'), mode: 'ok' },
    222222: { bu: idOf('HVAC - Service'), mode: 'ok' },
    333333: { bu: idOf('Tupelo Branch'), mode: 'locked' },
    444444: { bu: idOf('Greenville Branch'), mode: 'error' },
    555555: { bu: idOf('HCR'), mode: 'popup' },
    666666: { bu: idOf('Mendenhall Branch'), mode: 'ok' },
    777777: { bu: idOf('Commercial'), mode: 'nosave' },
    888888: { bu: idOf('Commercial'), mode: 'stay' },
    901001: { bu: idOf('Commercial'), mode: 'ok' }, 901002: { bu: idOf('Commercial'), mode: 'ok' },
    901003: { bu: idOf('Commercial'), mode: 'ok' }, 901004: { bu: idOf('Commercial'), mode: 'ok' }
  };
  window.buName = j => nameOf(DB[j].bu);
  window.saves = [];
  window.opened = [];
  // ServiceTitan's job data, as its pages read it. window.API_DOWN = true makes it unreadable,
  // API_401 = true answers like a signed-out session, API_DELAY = ms makes it slow (a request
  // can still be cut off by its caller, like a real one). apiActive / apiMax count requests in flight.
  window.apiCalls = 0; window.apiActive = 0; window.apiMax = 0;
  const realFetch = window.fetch;
  const pause = (ms, signal) => new Promise((res, rej) => {
    const t = setTimeout(res, ms);
    if (signal) signal.addEventListener('abort', () => { clearTimeout(t); rej(new DOMException('The user aborted a request.', 'AbortError')); });
  });
  // ?full: the board's own data too (the day, every assignment with its techs, the Unassigned list),
  // a second tech, a job of Tech One's that isn't drawn (scrolled out of view), and canceled ones.
  window.FULL = location.search.indexOf('full') > -1;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const at = h => { const d = new Date(today); d.setHours(h); return d; };
  const T1 = { Id: 1, Name: 'Tech One' }, T2 = { Id: 2, Name: 'Tech Two' };
  window.FULL_ASSIGNMENTS = [111111, 222222, 333333, 444444, 555555, 666666, 777777, 888888].map((j, i) => ({ Id: 7000 + i, JobId: j, Customer: 'Cust ' + j, CustomerId: j, Start: at(8 + i % 8), Technicians: [T1], FirstName: 'Tech' }))
    .concat([
      { Id: 7100, JobId: 912345, Customer: 'Hidden Cust', CustomerId: 5, Start: at(17), Technicians: [T1] },
      { Id: 7101, JobId: 901001, Customer: 'Two Cust A', CustomerId: 6, Start: at(9), Technicians: [T2] },
      { Id: 7102, JobId: 901002, Customer: 'Two Cust B', CustomerId: 7, Start: at(11), Technicians: [T2] },
      { Id: 7103, JobId: 901005, Customer: 'Canceled Cust', CustomerId: 8, Start: at(13), Technicians: [T2], AppointmentStatus: 5 },
      { Id: 7104, JobId: 901006, Customer: 'Tomorrow Cust', CustomerId: 9, Start: new Date(at(9).getTime() + 86400000), Technicians: [T2] }
    ]);
  window.FULL_UNASSIGNED = [
    { JobId: 930001, Customer: 'Unas One', CustomerId: 11 },
    { JobId: 930002, Customer: 'Unas Two', CustomerId: 12 },
    { JobId: 930003, Customer: 'Unas Canceled', CustomerId: 13, AppointmentStatus: 5 },
    { JobId: 901001, Customer: 'Two Cust A', CustomerId: 6 }
  ];
  window.fetch = async (url, opts) => {
    const u = String(url);
    const json = (o, st) => new Response(JSON.stringify(o), { status: st || 200, headers: { 'Content-Type': 'application/json' } });
    if (u.indexOf('/Dispatch/GetJobs') === 0) {
      const b = JSON.parse((opts && opts.body) || '{}');
      window.lastGetJobs = b;
      const rows = b.JobType === 'Unassigned' && window.FULL ? window.FULL_UNASSIGNED : [];
      return json({ Count: rows.length, Jobs: rows.slice(b.QueryFilter.Skip, b.QueryFilter.Skip + b.QueryFilter.Take) });
    }
    // Every signed-in user can read this (asked after a 401 to tell "signed out" from "not allowed").
    if (u.indexOf('/api/cp/settings/special/permission-settings') === 0) return window.API_401 ? new Response('', { status: 401 }) : json({ Settings: [] });
    let m = /^\/Job\/Edit\/(\d+)/.exec(u) || /^\/Job\/Index\/\?id=(\d+)/.exec(u);
    if (!m) return realFetch(url, opts);
    // JOB_NO_PERMISSION = true: this login can't open job records (401 while still signed in).
    if (window.JOB_NO_PERMISSION) { window.noPermCalls = (window.noPermCalls || 0) + 1; return new Response('', { status: 401 }); }
    window.apiCalls++; window.apiActive++; window.apiMax = Math.max(window.apiMax, window.apiActive);
    try { await pause(window.API_DELAY || 40, opts && opts.signal); } finally { window.apiActive--; }
    if (window.API_401) return new Response('', { status: 401 });
    if (window.API_DOWN) return json({ error: 'down' }, 500);
    const j = m[1];
    window.NOTIF = window.NOTIF || {};
    const job = DB[j];
    if (/^\/Job\/Edit\//.test(u)) {
      if (!job) return json({}, 404);
      return json({ Id: Number(j), BusinessUnitId: job.bu, BusinessUnit: nameOf(job.bu), IsBusinessUnitReadOnly: job.mode === 'locked' });
    }
    return json({ Id: Number(j), NotificationsEnabled: j in window.NOTIF ? window.NOTIF[j] : true, BusinessUnit: job ? nameOf(job.bu) : 'Commercial' });
  };
  // The new Dispatch board (newboard.js). Tech One has the DB jobs under 900000. With ?full, Tech
  // Two (901001, 901002), a job of Tech One's further along the day (912345), a canceled
  // appointment (901005) and tomorrow's (901006) are in the board's data too. The Jobs Tray shows
  // the Hold tab (901003, 901004), and with FILLER 60 more rows under a tall board.
  NB.setup({
    techs: () => [{ id: 1, name: 'Tech One', team: 'Install HVAC', teamId: 1 }].concat(window.FULL ? [{ id: 2, name: 'Tech Two', team: 'Install HVAC', teamId: 1 }] : []),
    appts: () => window.FULL
      ? window.FULL_ASSIGNMENTS.map(a => ({ id: a.Id, job: a.JobId, techs: (a.Technicians || []).map(t => t.Id), customer: a.Customer, customerId: a.CustomerId, start: a.Start, status: a.AppointmentStatus === 5 ? 'Canceled' : 'Scheduled' }))
      : Object.keys(DB).filter(j => j < 900000).map((j, i) => ({ id: 7000 + i, job: Number(j), techs: [1], customer: 'Cust ' + j, customerId: Number(j) })),
    tray: () => [{ job: 901003, customer: 'Tray Cust 901003 ', customerId: 3 }, { job: 901004, customer: 'Tray Cust 901004', customerId: 4 }],
    trayTab: 'Hold',
    filler: () => window.FILLER ? 60 : 0   // FILLER: a long Jobs Tray under a tall board (set it, then NB.render())
  });
  function render() {
    const h = location.hash.split('?')[0];
    const root = document.getElementById('root');
    if (!NB.isBoard(location.hash)) root.innerHTML = '';
    let m;
    if (NB.isBoard(location.hash) || /^#\/DispatchBoard/.test(h)) return;   // the board draws itself (NB.render)
    if ((m = /^#\/Job\/Edit\/(\d+)/.exec(h))) {
      const j = m[1], job = DB[j];
      (window.editOpened = window.editOpened || []).push(j);
      setTimeout(() => {
        if (location.hash.split('?')[0] !== h) return;
        const form = document.createElement('form');
        form.setAttribute('data-bind', 'submit: $data.save');
        form.innerHTML = '<label class="control-label">Business Unit</label><select name="BusinessUnit"></select>' +
          '<div class="errs"></div><button class="btn btn-success"><i class="icon-save"></i> Save</button> <a class="btn-link muted" href="#/Job/Index/' + j + '">Cancel</a>' +
          '<div class="modal"><div class="modal-body">Changing the business unit will update the invoice. Continue?</div><button type="button">OK</button></div>';
        const sel = form.querySelector('select');
        BUS.forEach(b => { const o = document.createElement('option'); o.value = String(b[0]); o.textContent = b[1]; sel.appendChild(o); });
        const vm = {
          Id: Number(j),
          BusinessUnitId: window.ko ? window.ko.observable(job.bu) : null,
          IsBusinessUnitReadOnly: job.mode === 'locked'
        };
        sel.value = String(job.bu);
        sel.disabled = vm.IsBusinessUnitReadOnly;
        sel.addEventListener('change', () => { if (vm.BusinessUnitId) vm.BusinessUnitId(Number(sel.value)); });
        form.__vm = vm;
        form.addEventListener('submit', e => {
          e.preventDefault();
          const val = vm.BusinessUnitId ? vm.BusinessUnitId() : Number(sel.value);
          window.saves.push([j, nameOf(val)]);
          if (job.mode === 'error') { form.querySelector('.errs').innerHTML = '<span class="field-validation-error">Summary is required.</span>'; return; }
          if (job.mode === 'popup') { form.querySelector('.modal').classList.add('in'); return; }
          setTimeout(() => {
            if (job.mode !== 'nosave') job.bu = val;
            if (job.mode !== 'stay') location.hash = '#/Job/Index/' + j;
          }, 400);
        });
        root.appendChild(form);
      }, 350);
    } else if ((m = /^#\/Job\/Index\/(\d+)/.exec(h))) {
      const j = m[1];
      (window.indexOpened = window.indexOpened || []).push(j);
      window.NOTIF = window.NOTIF || {};
      if (!(j in window.NOTIF)) window.NOTIF[j] = true;
      setTimeout(() => {
        if (location.hash.split('?')[0] !== h) return;
        root.innerHTML = '<h2>Job #' + j + '</h2><div class="qa-job-notification-toggle"><input id="nt" type="checkbox" class="ToggleSwitch__input"' + (window.NOTIF[j] ? ' checked' : '') + '><label for="nt" class="ToggleSwitch__html-label">Job Notifications</label></div>';
        // NOTIF_STUCK[job] = true: the switch moves but ServiceTitan doesn't save it, and it snaps back.
        root.querySelector('#nt').addEventListener('change', e => {
          if (window.NOTIF_STUCK && window.NOTIF_STUCK[j]) { const was = !e.target.checked; setTimeout(() => { e.target.checked = was; }, 200); return; }
          window.NOTIF[j] = e.target.checked;
        });
      }, 300);
    }
  }
  addEventListener('hashchange', render);
  addEventListener('DOMContentLoaded', render);
</script></head>
<body><div id="root"></div></body></html>
