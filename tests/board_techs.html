<!doctype html>
<html><head><meta charset="utf-8"><title>Mock board techs</title>
<style>body{font:13px sans-serif;margin:0}</style>
<script src="newboard.js"></script>
<script>
  // The new Dispatch board (newboard.js) with two teams: Install HVAC (Tech One, Tech Two) and
  // Leadership Team (Boss Man), one job each (7001, 7002, 7003).
  window.opened = [];
  window.TEAMS = [['Install HVAC', [[1, 'Tech One'], [2, 'Tech Two']]], ['Leadership Team', [[3, 'Boss Man']]]];
  NB.setup({
    techs: () => [].concat.apply([], TEAMS.map(([team, ts], i) => ts.map(([id, name]) => ({ id, name, team, teamId: i + 1, status: (window.STATUS || {})[id] })))),
    appts: () => [].concat.apply([], TEAMS.map(([team, ts]) => ts.map(([id]) => ({ id: 9000 + id, job: 7000 + id, techs: [id], customer: 'Job ' + (7000 + id) })))),
    onCard: job => window.opened.push('job' + job),
    menu: true
  });
</script></head><body><div id="root"></div></body></html>
