<!doctype html>
<html><head><meta charset="utf-8"><title>Mock ServiceTitan new Dispatch board</title>
<style>
  body{font:13px sans-serif;margin:0}
  .Drawer{position:fixed;top:60px;left:20px;width:320px;background:#fff;border:1px solid #333;padding:10px;z-index:5}
  .modal{display:none}
  .modal.in{display:block;position:fixed;top:30%;left:30%;background:#fff;border:2px solid #333;padding:20px}
  .chat{position:fixed;left:0;top:0;bottom:0;width:320px;background:#eef;padding:8px}
</style>
<script>
  // A stand-in for ServiceTitan's new Dispatch board (Oct 2026): #/widget-app/dispatch-center, a
  // component with its own page inside it (an open shadow root) that only draws the tech rows on
  // screen. Laid out like the real one:
  //   [data-mfe-name="servicetitan-dispatch-center"] (shadow root)
  //     header: [data-auto-sel="dc-header-date-picker"] "Wed, Oct 28, 2026", prev/next/today, Refresh
  //     [data-testid="timeline-scroll-viewport"]: team groups [data-cy^="ddb-team-group-"] (no text),
  //       tech names [data-cy="ddb-technician-header-<id>"][data-technician-id] <p>Name</p>,
  //       job bubbles [data-cy="wdb-job-appt-card"][data-job-appointment-id][data-technician-id]
  //       (the job behind each one is in the page's props: __reactFiber… memoizedProps.jobAppointment)
  //     a right-click on a tech's name: [data-cy="ddb-technician-menu"] with [data-cy="tmi-send-message"]
  //     the Activity Center (Send Message) inside it, with its own shadow root
  //     the Jobs Tray: tabs [data-cy^="custom-tab-item-"], [data-cy="dc-jt-unassigned-table"] rows
  //       tr.k-master-row with [data-cy="dc-jt-job-appointment-cell"] "8001-1" (props: dataItem)
  //   The address: #/widget-app/dispatch-center?date=YYYY-MM-DD&dispatchFilterCode=CODE&… (no date:
  //   today). #/DispatchBoard goes there. The code is decoded by /dispatch-center/decoding.
  // Plus the pages the tools visit: a job's page (notifications switch), its Edit page (Business
  // Unit), a customer's page (Add Note) and a conversation (Chat Center).
  // ?week: the Week view (tech names wdb-technician-header-<id>, the menu wdb-technician-menu, and the
  // list [data-cy="dc-wdb-virtual-list"] inside a box that scrolls, with no name). Like the real one,
  // a closed tech menu stays on the page, hidden.
  // Test switches: BOARD_STUCK (the board doesn't redraw after a change until Refresh), DRIFT
  // ('noTechId', 'noApptId', 'noDate'), DECODE_DOWN, DISPATCH_DRIFT.
  (function () {
    const obs = v => { const f = function (x) { if (arguments.length) { v = x; return f; } return v; }; f.__obs = true; return f; };
    const toJS = v => { if (v && v.__obs) v = v(); if (Array.isArray(v)) return v.map(toJS); if (v && typeof v === 'object' && !(v instanceof Date)) { const o = {}; Object.keys(v).forEach(k => { o[k] = toJS(v[k]); }); return o; } return v; };
    window.ko = { observable: obs, isObservable: f => !!(f && f.__obs), unwrap: v => (v && v.__obs) ? v() : v, toJS,
      dataFor: e => { while (e) { if (e.__vm) return e.__vm; e = e.parentElement; } return undefined; } };
  })();
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const at = (h, m) => { const d = new Date(today); d.setHours(h, m || 0, 0, 0); return d; };
  const tomorrow = h => { const d = at(h); d.setDate(d.getDate() + 1); return d; };
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const same = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  window.App = {
    Notifications: { store: { userId: 42 } },
    Data: { EnableSkillsManagement: true, BusinessUnits: [{ Id: 1, Name: 'Mendenhall Branch', Active: true }, { Id: 2, Name: 'Other Branch', Active: true }], Technicians: [],
      Users: [{ Id: 42, Name: 'andrewj' }], Employees: [{ Id: 901, Name: 'andrew Jones', UserId: 42 }] }
  };
  window.ZIPS = {
    '39114': [31.952, -89.825], '39111': [31.873, -89.733], '39044': [32.010, -89.980], '39149': [31.840, -90.020],
    '39073': [32.150, -90.130], '39201': [32.290, -90.180], '39151': [32.200, -89.950], '39120': [31.560, -91.400],
    '39440': [31.690, -89.130], '39208': [32.270, -90.100], '39180': [32.350, -90.880]
  };
  // Teams, in the board's order, with their IDs (the team filter uses them).
  window.TEAMS = [[501, 'Level 1 Service'], [502, 'Level 2 Service'], [503, 'Installers'], [504, 'Sales/ Service - Dustin J'], [505, 'Project Coordinator - Dustin J'], [506, 'Dispatch']];
  window.TECHS = [
    { id: 201, name: 'Ana R', team: 'Level 1 Service', home: [31.90, -89.75], addr: '12 Oak St, Magee, MS 39111 USA', active: true },
    { id: 202, name: 'Ben T', team: 'Level 1 Service', home: [32.05, -89.90], addr: '9 Pine Rd, BRAXTON, MS 39044 USA', active: true },
    { id: 205, name: 'Eli G', team: 'Level 1 Service', home: null, addr: '', active: true },
    { id: 207, name: 'Gus K', team: 'Level 1 Service', home: [32.20, -89.95], addr: '8 Birch Ct, Puckett, MS 39151 USA', active: true },
    { id: 203, name: 'Cal M', team: 'Installers', home: [31.70, -90.00], addr: '5 Elm Dr, Pinola, MS 39149 USA', active: true },
    { id: 204, name: 'Dee F', team: 'Installers', home: null, addr: '77 Cedar Ln, Apt 2, Florence, MS 39073 USA', active: true },
    { id: 206, name: 'Fay H', team: 'Installers', home: [31.80, -89.95], addr: '3 Ash St, Pinola, MS 39149 USA', active: true },
    { id: 211, name: 'Kim S', team: 'Sales/ Service - Dustin J', home: [31.69, -89.13], addr: '6 Bay Ct, Laurel, MS 39440 USA', active: true },
    { id: 212, name: 'Lou P', team: 'Project Coordinator - Dustin J', home: [32.29, -90.18], addr: '2 Lake Dr, Jackson, MS 39201 USA', active: true },
    { id: 208, name: 'Hal L', team: 'Dispatch', home: [32.30, -90.18], addr: '1 Main St, Jackson, MS 39201 USA', active: true, managed: false },
    { id: 209, name: 'Ivy N', team: 'Dispatch', home: [31.95, -89.82], addr: '4 Gone Way, Mendenhall, MS 39114 USA', active: false }
  ];
  // Thirty more techs in Level 2 Service, so most rows are off screen (the board only draws ~8).
  for (let i = 1; i <= 30; i++) TECHS.push({ id: 300 + i, name: 'Fill ' + pad(i) + ' Z', team: 'Level 2 Service', home: [32.40, -90.60], addr: '1 Far Rd, Vicksburg, MS 39180 USA', active: true });
  const teamId = name => (TEAMS.find(t => t[1] === name) || [0])[0];
  const tname = id => (TECHS.find(t => t.id === id) || {}).name || ('#' + id);
  const STATUS_NUM = { Scheduled: 0, Dispatched: 1, Working: 2, Hold: 3, Done: 4, Canceled: 5 };
  const MAINT = 'Maintenance - Fall - Residential', INSTALL = 'Install - Generator', SALES = 'Sales - Comfort Advisor';
  // Appointments: appointment id -> job, visit, customer, time, techs, status, zip, city, type, priority, branch.
  window.APPTS = {
    9801: { job: 8001, n: 1, cust: 'Kay Lin', s: at(13), e: at(15), techs: [], status: 'Scheduled', zip: '39111', city: 'Magee', type: MAINT, prio: 'Normal' },
    9802: { job: 8002, n: 1, cust: 'Lee Moe', s: at(8), e: at(10), techs: [205], status: 'Working', zip: '39111', city: 'Magee', type: MAINT },
    9803: { job: 8003, n: 1, cust: 'Mo Nash', s: at(9), e: at(11), techs: [206], status: 'Dispatched', zip: '39149', city: 'Pinola', type: INSTALL },
    9804: { job: 8004, n: 1, cust: 'Ned Orr', s: at(7), e: at(8), techs: [207], status: 'Done', zip: '39044', city: 'Braxton', type: MAINT },
    9805: { job: 8005, n: 1, cust: 'Oli Park', s: at(14), e: at(16), techs: [207], status: 'Scheduled', zip: '39201', city: 'Jackson', type: MAINT },
    9807: { job: 8007, n: 1, cust: 'Quin Ray', s: at(15), e: at(16), techs: [201], status: 'Scheduled', zip: '39114', city: 'Mendenhall', type: MAINT },
    9808: { job: 8008, n: 1, cust: 'Ria Shaw', s: at(9), e: at(10), techs: [201], status: 'Scheduled', zip: '39114', city: 'Mendenhall', type: MAINT },
    9810: { job: 8010, n: 1, cust: 'Rae Sun', s: tomorrow(9), e: tomorrow(11), techs: [], status: 'Scheduled', zip: '39073', city: 'Florence', type: MAINT },
    9812: { job: 8012, n: 1, cust: 'Tia Uhl', s: tomorrow(10), e: tomorrow(12), techs: [202], status: 'Scheduled', zip: '39044', city: 'Braxton', type: MAINT },
    9820: { job: 8020, n: 1, cust: 'Uma Vale', s: at(14), e: at(16), techs: [], status: 'Scheduled', zip: '39201', city: 'JACKSON', type: INSTALL, prio: 'Normal' },
    9821: { job: 8021, n: 1, cust: 'Vic Wade', s: at(9), e: at(11), techs: [], status: 'Scheduled', zip: '39044', city: 'Braxton', type: MAINT, prio: 'High' },
    9830: { job: 8030, n: 1, cust: 'Yul Zane', s: at(8), e: at(17), techs: [203], status: 'Scheduled', zip: '39149', city: 'Pinola', type: INSTALL },
    9841: { job: 8041, n: 1, cust: 'Bo Cole', s: at(8), e: at(9), techs: [211], status: 'Scheduled', zip: '39201', city: 'Jackson', type: SALES },
    9843: { job: 8043, n: 1, cust: 'Di Ernst', s: at(8), e: at(9), techs: [212], status: 'Scheduled', zip: '39208', city: 'Pearl', type: SALES },
    // On the last filler tech (far down the board) and an unassigned one from another branch.
    9850: { job: 8050, n: 1, cust: 'Zoe End', s: at(10), e: at(11), techs: [330], status: 'Scheduled', zip: '39114', city: 'Mendenhall', type: MAINT },
    9851: { job: 8051, n: 1, cust: 'Ann Two', s: at(13), e: at(14), techs: [330], status: 'Scheduled', zip: '39114', city: 'Mendenhall', type: MAINT },
    9860: { job: 8060, n: 1, cust: 'Oz Away', s: at(10), e: at(12), techs: [], status: 'Scheduled', zip: '39120', city: 'Natchez', type: MAINT, bu: 2 },
    9861: { job: 8061, n: 1, cust: 'Pip Far', s: at(11), e: at(12), techs: [206], status: 'Scheduled', zip: '39120', city: 'Natchez', type: MAINT, bu: 2 }
  };
  Object.keys(APPTS).forEach(k => { const a = APPTS[k]; a.custId = a.job + 10000; if (!a.bu) a.bu = 1; });
  // Holds (the Jobs Tray's Hold tab and the Hold list): job -> customer, type.
  window.HOLDS = [[8101, 'Hal Hold', 'Quote - Generator'], [8102, 'Hope Hold', 'Quote - Water Heater']];
  const HISTORY = { 211: [SALES, SALES], 212: [SALES, SALES], 201: [MAINT, MAINT], 202: [MAINT, MAINT], 205: [MAINT, MAINT], 207: [MAINT, MAINT], 203: [INSTALL, INSTALL], 204: [INSTALL, INSTALL], 206: [INSTALL, MAINT] };
  // Customers: id -> name, mobile (10 digits). Every job's customer, and the holds'.
  window.CUST = {};
  Object.keys(APPTS).forEach(k => { const a = APPTS[k]; CUST[a.custId] = { name: a.cust, mobile: '601555' + String(a.job).slice(-4) }; });
  HOLDS.forEach(h => { CUST[h[0] + 10000] = { name: h[1], mobile: '601555' + String(h[0]).slice(-4) }; });
  const jobCust = j => { const k = Object.keys(APPTS).find(x => String(APPTS[x].job) === String(j)); if (k) return APPTS[k].custId; const h = HOLDS.find(x => String(x[0]) === String(j)); return h ? h[0] + 10000 : null; };
  const BU_NAME = { 1: 'Mendenhall Branch', 2: 'Other Branch' };
  window.JOB_BU = {};    // job -> branch (Business Unit tool), from the appointments
  Object.keys(APPTS).forEach(k => { JOB_BU[APPTS[k].job] = APPTS[k].bu; });
  HOLDS.forEach(h => { JOB_BU[h[0]] = 1; });
  window.NOTIF = {};     // job -> notifications on (default true)
  // The filter codes in the address, decoded.
  window.CODES = {
    MEND: { businessUnitIds: [1], teamIds: [], skillIds: [], shiftTypes: [] },
    ALL: { businessUnitIds: [], teamIds: [], skillIds: [], shiftTypes: [] },
    L1: { businessUnitIds: [1], teamIds: [501], skillIds: [], shiftTypes: [] }
  };

  window.mbCalls = []; window.zctaCalls = []; window.opened = []; window.calls = []; window.dataCalls = []; window.getJobsCalls = [];
  window.decodeCalls = []; window.SENT = []; window.TEXTS = []; window.saves = []; window.custOpened = []; window.chatOpened = [];
  window.refreshClicks = 0; window.CHATS = {};
  window.open = (u) => { window.opened.push(String(u)); return null; };
  const mi = (a, b) => { const R = 3958.8, r = x => x * Math.PI / 180; const h = Math.sin(r(b[0] - a[0]) / 2) ** 2 + Math.cos(r(a[0])) * Math.cos(r(b[0])) * Math.sin(r(b[1] - a[1]) / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };
  const realFetch = window.fetch;
  // One appointment as ServiceTitan's data has it.
  const rowFor = k => {
    const a = APPTS[k];
    return { Id: Number(k), JobId: a.job, AppointmentNumber: a.n, Customer: a.cust, CustomerId: a.custId, Start: a.s.toISOString(), End: a.e.toISOString(), BusinessUnitId: a.bu,
      Zip: a.zip, City: a.city, Street: '55 Secret Rd', Type: a.type, TypeId: (a.type || '').length, Priority: a.prio || 'Normal', IsConfirmed: false,
      Technicians: a.techs.map(id => ({ Id: id, Name: tname(id) })), TechnicianId: a.techs[0] || 0, AppointmentStatus: a.status, Status: a.status };
  };
  const activeTechs = () => TEAMS.reduce((out, t) => out.concat(TECHS.filter(x => x.active && x.team === t[1])), []);
  window.fetch = async (url, opts) => {
    const u = String(url);
    const json = (o, st) => new Response(JSON.stringify(o), { status: st || 200, headers: { 'Content-Type': 'application/json' } });
    const body = opts && opts.body ? JSON.parse(opts.body) : null;
    await new Promise(r => setTimeout(r, 20));
    let m;
    if (u.indexOf('https://api.mapbox.com/') === 0) {
      window.mbCalls.push({ url: u });
      const leg = (a, b) => ({ s: mi(a, b) * 1.2 / 45 * 3600, d: mi(a, b) * 1.2 * 1609.34 });
      const pts = str => str.split(';').map(x => { const [lon, lat] = x.split(',').map(Number); return [lat, lon]; });
      if ((m = /directions-matrix\/v1\/mapbox\/([\w-]+)\/([^?]+)\?/.exec(u))) {
        const p = pts(m[2]), q = new URL(u).searchParams;
        if (p.length > (m[1] === 'driving-traffic' ? 10 : 25)) return json({ code: 'InvalidInput', message: 'too many coordinates' }, 422);
        const src = q.get('sources').split(';').map(Number), dst = q.get('destinations').split(';').map(Number);
        return json({ code: 'Ok', durations: src.map(i => dst.map(k => leg(p[i], p[k]).s)), distances: src.map(i => dst.map(k => leg(p[i], p[k]).d)) });
      }
      m = /driving(?:-traffic)?\/(-?[\d.]+),(-?[\d.]+);(-?[\d.]+),(-?[\d.]+)\?/.exec(u);
      if (!m) return json({ code: 'InvalidInput' }, 422);
      const l = leg([Number(m[2]), Number(m[1])], [Number(m[4]), Number(m[3])]);
      return json({ code: 'Ok', routes: [{ duration: l.s, distance: l.d }] });
    }
    if (u.indexOf('https://tigerweb.geo.census.gov/') === 0) {
      window.zctaCalls.push({ url: u });
      const where = new URL(u).searchParams.get('where') || '';
      const zips = (where.match(/'(\d{5})'/g) || []).map(z => z.slice(1, 6));
      return json({ features: zips.filter(z => ZIPS[z]).map(z => ({ attributes: { ZCTA5: z, INTPTLAT: '+' + ZIPS[z][0].toFixed(7), INTPTLON: ZIPS[z][1].toFixed(7) } })) });
    }
    if (u.indexOf('/api/cp/settings/special/permission-settings') === 0) return json({ Settings: [] });
    if (u.indexOf('/app/api/data/technicians') === 0) return json(TECHS.map(t => ({ id: t.id, name: t.name, active: t.active, isManagedTechnician: t.managed !== false, skillIds: [],
      houseLatitude: t.home ? t.home[0] : null, houseLongitude: t.home ? t.home[1] : null, houseAddress: t.addr || null })));
    if ((m = /^\/dispatch-center\/decoding\?Code=([^&]+)/.exec(u))) {
      window.decodeCalls.push(decodeURIComponent(m[1]));
      if (window.DECODE_DOWN) return json({ error: 'down' }, 500);
      const c = CODES[decodeURIComponent(m[1])];
      return c ? json({ item: c }) : json({ error: 'no such code' }, 404);
    }
    if (u.indexOf('/Dispatch/Data') === 0) {
      window.dataCalls.push(body);
      if (window.DISPATCH_DRIFT) return json({ technicians: [] });
      const day = new Date(body.date);
      const bus = (body.filter && body.filter.businessUnitIds) || [], teams = (body.filter && body.filter.teamIds) || [];
      const techs = activeTechs().filter(t => !teams.length || teams.indexOf(teamId(t.team)) > -1);
      if (day < today) {
        let n = 0;
        return json({ Technicians: techs.map(t => ({ Id: t.id, Name: t.name, Team: t.team, Status: 'Idle',
          Assignments: (HISTORY[t.id] || []).map(type => { n++; const s = new Date(day); s.setHours(8 + n % 8); const e = new Date(s); e.setHours(s.getHours() + 1);
            return { Id: 50000 + n, JobId: 60000 + t.id * 100 + n, Start: s.toISOString(), End: e.toISOString(), AppointmentStatus: 'Done', Status: 'Done', City: 'Mendenhall', Zip: '39114', Type: type, TypeId: type.length, Technicians: [{ Id: t.id, Name: t.name }] }; }) })) });
      }
      // Like the real data: each tech's appointments (Technicians left out; the Toolbox fills them in).
      return json({ Technicians: techs.map(t => ({ Id: t.id, Name: t.name, Team: t.team, Status: 'Idle',
        Assignments: Object.keys(APPTS).filter(k => APPTS[k].techs.indexOf(t.id) > -1 && same(APPTS[k].s, day) && (!bus.length || bus.indexOf(APPTS[k].bu) > -1))
          .map(k => { const r = rowFor(k); if (APPTS[k].techs.length < 2) { delete r.Technicians; delete r.TechnicianId; } return r; }) })) });
    }
    if ((m = /GetJobAppointments\?jobId=(\d+)/.exec(u))) {
      const ks = Object.keys(APPTS).filter(k => String(APPTS[k].job) === m[1]);
      if (!ks.length) return json([]);
      return json(ks.map(k => ({ id: Number(k), status: STATUS_NUM[APPTS[k].status], start: APPTS[k].s.toISOString() })));
    }
    if ((m = /GetJobEditFlyoutData\?appointmentId=(\d+)/.exec(u))) {
      const a = APPTS[m[1]];
      if (!a) return json({}, 404);
      const visits = Object.keys(APPTS).filter(k => APPTS[k].job === a.job);
      return json({ jobId: a.job, jobNumber: String(a.job), businessUnitId: a.bu, jobTotal: 0,
        locationAddress: { id: 1, street: '55 Secret Rd', unit: null, city: a.city, state: 'MS', zip: a.zip },
        jobAppointments: visits.map(k => ({ id: Number(k), number: APPTS[k].n, start: APPTS[k].s.toISOString(), end: APPTS[k].e.toISOString(),
          technicians: APPTS[k].techs.map(id => ({ id, name: tname(id) })), jobAppointmentStatus: STATUS_NUM[APPTS[k].status], isConfirmed: false })) });
    }
    if ((m = /GetJobOverviewData\?jobId=(\d+)/.exec(u))) return json({ jobTags: [], skills: [], businessUnit: { id: 1, name: 'Mendenhall Branch' } });
    if (u.indexOf('/Job/TechniciansAreBooked') === 0) {
      const s0 = new Date(body.start), e0 = new Date(body.end);
      const busy = id => Object.keys(APPTS).some(k => String(k) !== String(body.originalAppointmentId) && APPTS[k].status !== 'Canceled' && APPTS[k].techs.indexOf(id) > -1 && APPTS[k].s < e0 && s0 < APPTS[k].e);
      return json(body.technicianIds.filter(busy).map(id => ({ TechnicianId: id, IsBookedForJob: true, IsBookedForNonJobEvent: false, IsBookedForRecurring: false })));
    }
    if ((m = /\/dispatch\/job-edit-flyout\/(Assign|Unassign)Technicians/.exec(u))) {
      const a = APPTS[body.appointmentId];
      if (!a) return json({}, 404);
      window.calls.push([m[1].toLowerCase(), body.appointmentId, body.technicianIds.slice()]);
      if (m[1] === 'Assign') a.techs = a.techs.concat(body.technicianIds.filter(id => a.techs.indexOf(id) < 0));
      else a.techs = a.techs.filter(id => body.technicianIds.indexOf(id) < 0);
      // The board shows changes by itself a moment later (unless BOARD_STUCK).
      if (!window.BOARD_STUCK) setTimeout(() => { snapshot(); drawBoard(); }, 60);
      return new Response('', { status: 200 });
    }
    if (u.indexOf('/Dispatch/GetJobs') === 0) {
      window.getJobsCalls.push(body);
      const day = new Date(body.Date), bus = body.QueryFilter.BusinessUnitIds || [];
      let rows = [];
      if (body.JobType === 'Unassigned') rows = Object.keys(APPTS).filter(k => !APPTS[k].techs.length && same(APPTS[k].s, day) && (!bus.length || bus.indexOf(APPTS[k].bu) > -1)).map(rowFor);
      else if (body.JobType === 'Hold') rows = HOLDS.map(h => ({ JobId: h[0], Customer: h[1] + ' ', CustomerId: h[0] + 10000, Type: h[2], JobStatus: 'Hold', AppointmentStatus: 'Hold' }));
      return json({ Jobs: rows.slice(body.QueryFilter.Skip, body.QueryFilter.Skip + body.QueryFilter.Take), Count: rows.length });
    }
    if ((m = /^\/app\/api\/contact-methods\/getContactMethods\?ownerId=(\d+)&ownerType=Customer/.exec(u))) {
      const cu = CUST[m[1]];
      if (!cu) return json([]);
      return json([{ id: 10, type: 3, value: '(' + cu.mobile.slice(0, 3) + ') ' + cu.mobile.slice(3, 6) + '-' + cu.mobile.slice(6), memo: '' }]);
    }
    if ((m = /^\/GrowthChatCenter\/ChatThread\?number=(\d+)/.exec(u))) {
      const chat = CHATS[m[1]];
      if (!chat) return json({ Threads: [], HasNoMore: true });
      return json({ Threads: [{ ThreadId: Number(m[1]), ContactNumber: m[1], ReadStatus: 0, BlockedStatus: 0, Messages: [] }], HasNoMore: true });
    }
    if ((m = /^\/GrowthChatCenter\/Messages\?threadId=(\d+)/.exec(u))) {
      const chat = CHATS[m[1]];
      return json({ Messages: chat ? chat.msgs.map((x, i) => ({ SmsId: i + 1, Body: x.Body, CreatedOn: x.CreatedOn, SmsDirection: 1, Channel: 3, SmsSendErrorCode: 0, SmsDeliveryStatus: 0 })) : [], HasNoMore: true });
    }
