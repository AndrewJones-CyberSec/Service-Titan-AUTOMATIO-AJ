<!doctype html>
<html><head><meta charset="utf-8"><title>Mock ServiceTitan: Tech Router</title>
<style>body{font:13px sans-serif;margin:0}</style>
<script src="newboard.js"></script>
<script>
  // A stand-in for ServiceTitan for 🧭 Tech Router: the new board (newboard.js) for tomorrow (so no
  // open time is cut off by the clock), the Unassigned and Hold lists, the tech list with homes,
  // the last 4 weeks of schedules, and stand-ins for Mapbox and the US Census (drive times from
  // straight-line miles at 40 mph, zip code points from a table).
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const D0 = new Date(today); D0.setDate(D0.getDate() + 1);
  const on = (days, h, m) => { const d = new Date(D0); d.setDate(d.getDate() + days); d.setHours(h, m || 0, 0, 0); return d; };
  const at = (h, m) => on(0, h, m);
  const ago = (days, h) => { const d = new Date(today); d.setDate(d.getDate() - days); d.setHours(h || 9, 0, 0, 0); return d; };
  window.App = { Notifications: { store: { userId: 42 } }, Data: { EnableSkillsManagement: true, BusinessUnits: [{ Id: 1, Name: 'Mendenhall Branch', Active: true }] } };

  // Where things are (lat, lon).
  const P = { hatt: [31.33, -89.29], petal: [31.35, -89.26], purvis: [31.14, -89.41], jackson: [32.30, -90.18], magee: [31.87, -89.73] };
  window.ZIPS = { '39401': P.hatt, '39465': P.petal, '39475': P.purvis, '39201': P.jackson, '39111': P.magee };
  const PC = 'Project Coordinator - Dustin J', EL = 'Electrical Dept - Sales/Service - Jeff V', PL = 'Plumbing Dept - Sales/Service - James S', SA = 'Sales/ Service - Dustin J', IN = 'Install HVAC - Jeffrey V/Trey M Leadership';
  // The techs: id, name, team, home, managed (a field tech).
  window.TECHS = [
    { id: 201, name: 'Dustin J', team: PC, home: P.hatt, town: 'Hattiesburg', managed: true },
    { id: 202, name: 'Pat P', team: PC, home: P.magee, town: 'Magee', managed: true },
    { id: 203, name: 'Eli E', team: EL, home: P.petal, town: 'Petal', managed: true },
    { id: 204, name: 'Pam P', team: PL, home: P.purvis, town: 'Purvis', managed: true },
    { id: 205, name: 'Sam S', team: SA, home: P.jackson, town: 'Jackson', managed: true },
    { id: 206, name: 'Ian I', team: IN, home: P.hatt, town: 'Hattiesburg', managed: true },
    { id: 207, name: 'Olivia O', team: PC, home: P.hatt, town: 'Hattiesburg', managed: true },
    { id: 208, name: 'Office Owen', team: PC, home: null, managed: false }
  ];
  // Job types (id -> name).
  const T = { 11: 'Quote - HVAC - Central Home System', 12: 'Quote - Generator', 13: 'Quote - Water Heater', 14: 'Quote - Lead Turn Over - Generator', 15: 'Quote - Brand New Thing',
    16: 'Quote - Lead Turn Over - HVAC', 17: 'PHONE CALL ONLY', 21: 'Quote - Electrical', 31: 'Plumbing - Clogged Drain', 32: 'Plumbing - Water Leak', 41: 'Install - HVAC - Standard - Residential' };
  // The board's day (tomorrow): Dustin 8–10 in Hattiesburg and 1–3 in Petal (shift 8–5); Sam far from home;
  // Olivia has time off; Pat has nothing (and no shift on the board).
  window.APPTS = [
    { id: 9001, job: 7001, techs: [201], customer: 'Ann Early', start: at(8), end: at(10), zip: '39401', city: 'HATTIESBURG', jobType: T[11], jobTypeId: 11 },
    { id: 9002, job: 7002, techs: [201], customer: 'Bo Petal', start: at(13), end: at(15), zip: '39465', city: 'Petal', jobType: T[11], jobTypeId: 11 },
    { id: 9003, job: 7003, techs: [205], customer: 'Cy Far', start: at(8), end: at(10), zip: '39401', city: 'Hattiesburg', jobType: T[11], jobTypeId: 11 },
    { id: 9004, job: 7004, techs: [205], customer: 'Di Purvis', start: at(13), end: at(15), zip: '39475', city: 'Purvis', jobType: T[11], jobTypeId: 11 },
    { id: 9005, job: 7005, techs: [203], customer: 'Ed Volt', start: at(9), end: at(11), zip: '39465', city: 'Petal', jobType: T[21], jobTypeId: 21 }
  ];
  // Eli (203) has time off 7 AM–7 PM on the board too, at the same time as his job (like ServiceTitan on Oct 29 2026).
  window.SHIFTS = { 201: [[8, 17]], 203: [[8, 17], [7, 19, 'TimeOff']], 204: [[8, 17]], 205: [[8, 17]], 206: [[8, 17]], 207: [[8, 17, 'TimeOff']] };
  // The lists: [day offset or 'hold', id, job, customer, type, place, start h, hours, priority, phone, created (days ago)].
  const near = (p, d) => [p[0] + d, p[1] - d];
  window.LISTS = [
    [0, 9101, 7101, 'Near Quote', 11, near(P.hatt, 0.01), 11, 2, 'Normal', '6015550101', 3],
    [0, 9102, 7102, 'Sparky Lamp', 21, near(P.hatt, 0.005), 11, 2, 'Normal', '6015550102', 3],
    [0, 9103, 7103, 'Drippy Sink', 31, near(P.hatt, 0.005), 10, 2, 'Normal', '6015550103', 3],
    [0, 9104, 7104, 'Way Off', 11, P.jackson, 10, 2, 'Normal', '6015550104', 3],
    [0, 9105, 7105, 'Big Install', 41, near(P.hatt, 0.01), 8, 8, 'Normal', '6015550105', 3],
    [0, 9108, 7108, 'Late Quote', 11, near(P.petal, 0.01), 15.5, 1.5, 'Normal', '6015550108', 1],
    [3, 9106, 7106, 'Gen Later', 12, near(P.petal, 0.005), 9, 2, 'Normal', '6015550106', 10],
    [5, 9107, 7107, 'Long Quote', 11, near(P.hatt, 0.01), 8, 4, 'Normal', '6015550107', 5],
    ['hold', 9201, 7201, 'Holly Heater', 13, near(P.purvis, 0.01), -30, 1.5, 'High', '6015550201', 40],
    ['hold', 9202, 7202, 'Lee Turnover', 14, near(P.hatt, 0.02), -20, 2, 'Normal', '6015550202', 20],
    ['hold', 9203, 7203, 'Leaky Pipe', 32, near(P.hatt, 0.01), -10, 2, 'Normal', '6015550203', 15],
    ['hold', 9204, 7204, 'New Kind', 15, near(P.hatt, 0.01), -5, 1, 'Normal', '6015550204', 5],
    [0, 9109, 7109, 'Just Call', 17, near(P.hatt, 0.01), 11, 0.5, 'Normal', '6015550109', 2]
  ];
  const rowOf = x => {
    const [day, id, job, customer, type, pt, h, hrs, prio, phone, created] = x;
    const s = day === 'hold' ? ago(-h, 9) : on(day, Math.floor(h), (h % 1) * 60), e = new Date(+s + hrs * 3600000);
    return { Id: id, JobId: job, AppointmentNumber: 1, Customer: customer, CustomerPhone: '(' + phone.slice(0, 3) + ') ' + phone.slice(3, 6) + '-' + phone.slice(6), Type: T[type], TypeId: type, JobTypeId: 0,
      Priority: prio, Duration: hrs * 3600, Start: s.toISOString(), End: e.toISOString(), ArrivalWindowStart: s.toISOString(), ArrivalWindowEnd: e.toISOString(), CreatedOn: ago(created).toISOString(),
      // Like ServiceTitan on Oct 29 2026: the map point in Latitude / Longitude, JobLatitude / JobLongitude empty.
      Latitude: pt ? pt[0] : 0, Longitude: pt ? pt[1] : 0, JobLatitude: null, JobLongitude: null, Zip: '', City: 'Somewhere', State: 'MS', Tags: [], Technicians: [], AppointmentStatus: day === 'hold' ? 'Hold' : 'Scheduled', JobStatus: day === 'hold' ? 'Hold' : 'Scheduled', BusinessUnitId: 1 };
  };
  // The last 4 weeks: who did which job types (Dustin and Pat split the coordinators' jobs).
  const past = [];
  let pid = 50000;
  const did = (techs, type, n) => { for (let i = 0; i < n; i++) { const s = ago(2 + (i % 25), 9); past.push({ id: pid++, job: 60000 + pid, techs: [techs[i % techs.length]], start: s, end: new Date(+s + 7200000), jobType: T[type], jobTypeId: type, status: 'Done' }); } };
  did([201, 202], 11, 10); did([201, 202], 12, 6); did([201, 202], 13, 4); did([201, 202], 16, 5); did([201], 14, 1); did([201, 202], 17, 6);
  did([203], 21, 6); did([204], 31, 7); did([204], 32, 5); did([206], 41, 8); did([205], 11, 4);
  // A canceled one and one from 6 weeks ago don't count.
  past.push({ id: pid++, job: 69998, techs: [201], start: ago(3), end: ago(3, 11), jobType: T[21], jobTypeId: 21, status: 'Canceled' });
  past.push({ id: pid++, job: 69999, techs: [201], start: ago(42), end: ago(42, 11), jobType: T[31], jobTypeId: 31, status: 'Done' });
  window.PAST = past;

  // Skills: Dustin has Basic Quote (1); the generator quote needs Generator Certified (5).
  window.SKILLS = { 1: 'Basic Quote', 5: 'Generator Certified' };
  window.JOB_SKILLS = { 7101: [1], 7106: [5] };
  // Switches: MAPBOX_DOWN, CENSUS_DOWN, HOLD_DOWN, PAST_BAD (in newboard.js), API_DELAY (ms).
  window.WRITES = []; window.mapboxCalls = 0; window.censusCalls = 0; window.getJobsCalls = 0; window.mapboxCoords = [];
  const miles = (a, b) => { const R = 3958.8, r = x => x * Math.PI / 180; const h = Math.sin(r(b[0] - a[0]) / 2) ** 2 + Math.cos(r(a[0])) * Math.cos(r(b[0])) * Math.sin(r(b[1] - a[1]) / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };
  const realFetch = window.fetch;
  window.fetch = async (url, opts) => {
    const u = String(url);
    const json = (o, st) => new Response(JSON.stringify(o), { status: st || 200, headers: { 'Content-Type': 'application/json' } });
    const body = opts && opts.body ? JSON.parse(opts.body) : null;
    await new Promise(r => setTimeout(r, window.API_DELAY || 10));
    if (opts && opts.method === 'POST' && !/GetJobs|\/Dispatch\/Data|daily-assignments|technicians\/resources|activity-history|TechniciansAreBooked/.test(u)) window.WRITES.push(u);
    if (/\/(Assign|Unassign)Technicians|UpdateJobAppointment/.test(u)) window.WRITES.push(u);
    if (u.indexOf('https://api.mapbox.com/') === 0) {
      window.mapboxCalls++;
      if (opts && opts.credentials !== 'omit') window.mapboxCookies = true;
      if (window.MAPBOX_DOWN) return json({ message: 'down' }, 500);
      const m = /\/mapbox\/[a-z-]+\/([^?]+)\?(.*)$/.exec(u);
      const pts = decodeURIComponent(m[1]).split(';').map(p => p.split(',').map(Number)).map(([lon, lat]) => [lat, lon]);
      pts.forEach(p => window.mapboxCoords.push(p));
      const q = new URLSearchParams(m[2]);
      const src = q.get('sources').split(';').map(Number), dst = q.get('destinations').split(';').map(Number);
      const mi = (a, b) => miles(pts[a], pts[b]) * 1.3;
      return json({ code: 'Ok', durations: src.map(a => dst.map(b => mi(a, b) / 40 * 3600)), distances: src.map(a => dst.map(b => mi(a, b) * 1609.34)) });
    }
    if (u.indexOf('https://tigerweb.geo.census.gov/') === 0) {
      window.censusCalls++;
      if (window.CENSUS_DOWN) return json({ error: 'down' }, 500);
      const zips = (new URLSearchParams(u.split('?')[1]).get('where').match(/\d{5}/g) || []);
      return json({ features: zips.filter(z => ZIPS[z]).map(z => ({ attributes: { ZCTA5: z, INTPTLAT: String(ZIPS[z][0]), INTPTLON: String(ZIPS[z][1]) } })) });
    }
    if (u.indexOf('/app/api/data/technicians') === 0) return json(TECHS.map(t => ({ id: t.id, name: t.name, active: true, isManagedTechnician: t.managed,
      skillIds: t.id === 201 ? [1] : [1, 5], houseLatitude: t.home ? t.home[0] : 0, houseLongitude: t.home ? t.home[1] : 0, houseAddress: t.home ? '1 Main St, ' + t.town + ', MS 39401 USA' : '' })));
    if (u.indexOf('/Dispatch/GetJobs') === 0) {
      window.getJobsCalls++;
      window.lastGetJobs = body;
      if (body.JobType === 'Hold' && window.HOLD_DOWN) return json({ error: 'boom' }, 500);
      const d = new Date(body.Date);
      const rows = LISTS.filter(x => body.JobType === 'Hold' ? x[0] === 'hold' : x[0] !== 'hold' && (() => { const s = on(x[0], 0); return s.getFullYear() === d.getFullYear() && s.getMonth() === d.getMonth() && s.getDate() === d.getDate(); })()).map(rowOf);
      return json({ Jobs: rows.slice(body.QueryFilter.Skip, body.QueryFilter.Skip + body.QueryFilter.Take), Count: rows.length });
    }
    if (/\/dispatch\/job-edit-flyout\/GetJobAppointments\?jobId=(\d+)/.test(u)) return json([]);
    let m;
    if ((m = /GetJobOverviewData\?jobId=(\d+)/.exec(u))) { window.skillCalls = (window.skillCalls || 0) + 1; return json({ jobTags: [], skills: (JOB_SKILLS[m[1]] || []).map(id => ({ id, name: SKILLS[id], active: true })) }); }
    return realFetch(url, opts);
  };
  NB.setup({
    bus: [1],
    day: D0,
    techs: () => TECHS.map(t => ({ id: t.id, name: t.name, team: t.team, teamId: [PC, EL, PL, SA, IN].indexOf(t.team) + 1 })),
    appts: () => APPTS.map(a => Object.assign({ n: 1, status: 'Scheduled', bu: 1 }, a)),
    shifts: id => (SHIFTS[id] || []).map(([a, b, type]) => ({ start: at(a), end: at(b), type: type || 'Normal' })),
    events: id => (window.EVENTS && window.EVENTS[id]) || [],
    past: () => PAST,
    tray: () => []
  });
</script>
</head><body><div id="root"></div></body></html>
